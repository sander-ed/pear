[package]
name = "pear"
version = "0.2.0"
edition = "2024"
description = "Tiny session manager: keep a terminal program running independently of your SSH session"
license = "MIT"

[features]
default = ["ghostty"]
# Use libghostty-vt to keep an exact terminal screen state so reattaching
# repaints the screen precisely. Without it, pear replays a raw output ring buffer.
ghostty = []

[dependencies]
libc = "0.2"

[build-dependencies]
pkg-config = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
